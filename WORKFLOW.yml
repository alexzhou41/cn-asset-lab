name: update-site

# 云端定时刷新：抓取最新的美国国会财务披露 -> 合并快照 -> 重算事后收益 -> 重建静态站 -> 部署 Pages
on:
  schedule:
    - cron: '17 */6 * * *'   # UTC，对应北京时间 01:17 / 07:17 / 13:17 / 19:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    # 用自托管 runner：GitHub 托管 runner 的出口 IP 是数据中心段，
    # Capitol Trades（Vercel Security Checkpoint）对它一律返回 429，抓不到数据。
    # 自托管 runner 让同一个工作流从住宅网络发出请求，调度与日志仍留在 GitHub 云端。
    runs-on: [self-hosted, cnassetlab]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 不用 actions/setup-python：它要写注册表安装 Python，自托管 runner 没有管理员
      # 权限会失败（Requested registry access is not allowed）。本机自带 Python 3.11，
      # 直接用它。
      - name: Locate Python
        shell: bash
        run: |
          set -e
          PY_EXE=""
          for cand in "C:/Users/thinkpad/AppData/Local/Programs/Python/Python311/python.exe" \
                      "C:/Python311/python.exe"; do
            if [ -f "$cand" ]; then PY_EXE="$cand"; break; fi
          done
          if [ -z "$PY_EXE" ]; then
            PY_EXE="$(command -v python || command -v python3)"
          fi
          "$PY_EXE" --version
          echo "PY_EXE=$PY_EXE" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          "$PY_EXE" -m pip install --upgrade pip
          "$PY_EXE" -m pip install -r requirements.txt

      # 美股日线缓存：700+ 个 ticker 的完整历史，重复抓取极慢。
      # 自托管 runner 的 checkout 每次都会被清空，所以缓存必须放在仓库之外的持久目录，
      # 用 US_PRICE_CACHE 传进去（Windows 上指向 _price_cache 目录联接）。
      - name: Refresh congressional trading data
        shell: bash
        env:
          US_PRICE_CACHE: ${{ runner.os == 'Windows' && 'C:\Users\thinkpad\.minimax\actions-runner\_price_cache' || format('{0}/us_stocks', runner.temp) }}
        run: |
          set -e
          "$PY_EXE" carry/policy_refresh.py

      - name: Commit refreshed snapshot and site
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carry/output/policy_trades_snapshot.csv \
                  carry/output/policy_trades.csv \
                  carry/output/policy_analysis.json \
                  miniapps/china-all-weather/miniapp/client/data.json \
                  site_cn_allweather/index.html
          if git diff --staged --quiet; then
            echo "no new disclosures"
          else
            git commit -m "chore: refresh congressional trading data $(date -u +%FT%TZ)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_cn_allweather

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
