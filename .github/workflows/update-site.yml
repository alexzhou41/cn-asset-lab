name: update-site

# 云端定时刷新：抓取最新的美国国会财务披露 -> 合并快照 -> 重算事后收益 -> 重建静态站 -> 发布到 GitHub -> 部署 Pages
#
# 三个绕不开的约束（都已在真实运行中验证过）：
#  1. Capitol Trades（Vercel Security Checkpoint）对所有数据中心出口 IP 一律 429，
#     公共代理（r.jina.ai / allorigins / codetabs…）本身也是数据中心段，同样 429。
#     所以抓取必须从住宅网络发出 -> 用本机自托管 runner。
#  2. 本机到 github.com / codeload.github.com / raw.githubusercontent.com 不可达
#     （connect timeout），只有 api.github.com 通 -> 不用 actions/checkout，也不用 git push，
#     改用 Git Data API（carry/api_commit.py + carry/github_api.py）。
#  3. 本机 Git 装在 D:\Program Files\Git，runner 找不到默认位置的 bash.exe；
#     actions/setup-python 又要写注册表（非管理员会失败）-> 全部步骤用 Windows PowerShell
#     加本机自带的 Python 3.11。
on:
  schedule:
    - cron: '17 */6 * * *'   # UTC，对应北京时间 01:17 / 07:17 / 13:17 / 19:17
  workflow_dispatch:
    inputs:
      deploy_only:
        description: '只重新发布已有产物，不抓取新数据'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, cnassetlab]
    timeout-minutes: 90
    env:
      WS: C:\Users\thinkpad\.minimax\sessions\mvs_3a2722267d8a4bfe89b4674dba46a98a\workspace
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Locate Python
        shell: powershell
        run: |
          $py = "C:\Users\thinkpad\AppData\Local\Programs\Python\Python311\python.exe"
          if (-not (Test-Path $py)) {
            $c = Get-Command python -ErrorAction SilentlyContinue
            if ($c) { $py = $c.Source }
          }
          if (-not $py) { throw "python interpreter not found" }
          & $py --version
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PY_EXE=$py`r`n")
          exit 0

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PY_EXE -m pip install -r "$env:WS\carry\requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          exit 0

      # 美股日线缓存：700+ 个 ticker 的完整历史，重复抓取极慢。
      # 缓存放在仓库之外的持久目录（_price_cache 是指向工作区 data\us_stocks 的目录联接），
      # 否则每次运行都要重抓一遍日线。
      - name: Refresh congressional trading data
        if: ${{ !inputs.deploy_only }}
        shell: powershell
        run: |
          $cache = "C:\Users\thinkpad\.minimax\actions-runner\_price_cache"
          if (-not (Test-Path $cache)) { $cache = Join-Path $env:RUNNER_TEMP "us_stocks" }
          $env:US_PRICE_CACHE = $cache
          Write-Output "price cache: $cache"
          & $env:PY_EXE "$env:WS\carry\policy_refresh.py"
          if ($LASTEXITCODE -ne 0) { throw "policy_refresh failed" }
          exit 0

      # 用 Git Data API 发布（api.github.com 可达，github.com 不可达，所以不能 git push）
      - name: Publish to GitHub via API
        shell: powershell
        run: |
          & $env:PY_EXE "$env:WS\carry\api_commit.py"
          if ($LASTEXITCODE -ne 0) { throw "api_commit failed" }
          exit 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: C:\Users\thinkpad\.minimax\sessions\mvs_3a2722267d8a4bfe89b4674dba46a98a\workspace\site_cn_allweather
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
