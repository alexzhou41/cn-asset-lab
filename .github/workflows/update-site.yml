name: update-site

# 云端定时刷新：抓取最新的美国国会财务披露 -> 合并快照 -> 重算事后收益 -> 重建静态站 -> 部署 Pages
on:
  schedule:
    - cron: '17 */6 * * *'   # UTC，对应北京时间 01:17 / 07:17 / 13:17 / 19:17
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    # 用自托管 runner：GitHub 托管 runner 的出口 IP 是数据中心段，
    # Capitol Trades（Vercel Security Checkpoint）对它一律返回 429，抓不到数据。
    # 自托管 runner 让同一个工作流从住宅网络发出请求，调度与日志仍留在 GitHub 云端。
    runs-on: [self-hosted, cnassetlab]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      # 美股日线缓存：每个 ticker 一个 csv，重复抓取很慢，缓存后每次运行只需补新增的
      - name: Cache US price history
        uses: actions/cache@v4
        with:
          path: data/us_stocks
          key: us-prices-${{ github.run_id }}
          restore-keys: |
            us-prices-

      - name: Refresh congressional trading data
        run: python carry/policy_refresh.py

      - name: Commit refreshed snapshot and site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carry/output/policy_trades_snapshot.csv \
                  carry/output/policy_trades.csv \
                  carry/output/policy_analysis.json \
                  miniapps/china-all-weather/miniapp/client/data.json \
                  site_cn_allweather/index.html
          if git diff --staged --quiet; then
            echo "no new disclosures"
          else
            git commit -m "chore: refresh congressional trading data $(date -u +%FT%TZ)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_cn_allweather

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
